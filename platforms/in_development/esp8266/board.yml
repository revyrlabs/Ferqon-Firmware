# Ferqon board definition — ESP8266 (NodeMCU / Wemos D1 Mini)
board: esp8266
display_name: "ESP8266 (NodeMCU)"
mcu: esp8266
backend: arduino
pio_env: esp8266

# Core & memory topology
core_count: 1
isr_serial_strategy: uart_rx_isr
ram_size_bytes: 80000
flash_size_bytes: 4194304
sys_clock_hz: 80000000
multicore: false

# GPIO
# ESP8266 uses GPIO numbers, not D-pin labels.
# D0=16, D1=5, D2=4, D3=0, D4=2, D5=14, D6=12, D7=13, D8=15
# GPIO 6-11 are reserved (flash), GPIO 1/3 are Serial TX/RX.
max_gpio: 16
led_pin: 2
reserved_pins: [0, 1, 3, 6, 7, 8, 9, 10, 11]

# ADC
adc:
  pins: [17]
  resolution_bits: 10
  vref_mv: 1000

# PWM
pwm:
  pins: [0, 2, 4, 5, 12, 13, 14, 15]

# Peripherals
spi:
  - instance: 0
    sck: [14]
    mosi: [13]
    miso: [12]
    cs: [15]

i2c:
  - {instance: 0, sda: [4], scl: [5]}

uart:
  - {instance: 0, tx: [1], rx: [3]}
  - {instance: 1, tx: [15], rx: [13]}

# Advanced / optional
pio_blocks: 0
pio_sm_per_block: 0
dma_channels: 0

# Network capabilities
network:
  link: []
  transport: [serial]
  ota: false
  provision: []

# Versioning
device_type: "esp8266-nodemcu"
protocol_version: "1.1.0"
capability_version: "1.0"
firmware_version: "1.1.0"

notes: |
  ESP8266 (NodeMCU / Wemos D1 Mini).
  Has 2 hardware UARTs — Serial and Serial1.
  GPIO 6-11 reserved (flash interface), GPIO 0/1/3 reserved (Serial).
  Single ADC pin (A0, GPIO 17) with 0-1V range.
  WiFi capable.
