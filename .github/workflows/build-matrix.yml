name: Build Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - pico_arduino
          - esp32
          - esp32s3
          - teensy40
          - teensy41

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f392efede  # v5.0.0
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        pip install platformio

    - name: Install dependencies
      run: |
        pip install -r tools/requirements.txt

    - name: Build ${{ matrix.env }}
      run: |
        pio run -e ${{ matrix.env }}

    - name: Upload firmware
      uses: actions/upload-artifact@65c4c7a0d31560bc3e2054bb0174c4ac91bc7f71  # v4.6.0
      with:
        name: firmware-${{ matrix.env }}
        path: .pio/build/${{ matrix.env }}/firmware.*