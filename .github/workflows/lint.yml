name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r tools/requirements.txt

    - name: Lint Python with ruff
      run: |
        ruff check tools/

    - name: Format check Python with black
      run: |
        black --check tools/

    - name: Lint YAML with yamllint
      run: |
        yamllint -c .yamllint platforms/*/board.yml protocol/spec/*.yml

    - name: Check platform capability guards
      run: |
        python tools/lint_platform_guards.py
