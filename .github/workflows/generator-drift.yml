name: Generator Drift Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f392efede  # v5.0.0
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r tools/requirements.txt

    - name: Check platform generator drift
      run: |
        python tools/gen_platform_caps.py --all --check

    - name: Check protocol generator drift
      run: |
        python tools/gen_protocol.py --check