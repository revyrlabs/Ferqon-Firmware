name: Native Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Native (host) unit tests — development only, not a production target.
  # ─────────────────────────────────────────────────────────────────────────
  native-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f392efede  # v5.0.0
      with:
        python-version: '3.10'

    - name: Install development dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run native tests
      run: |
        ferqonfw-dev test

  # ─────────────────────────────────────────────────────────────────────────
  # Production CLI regression tests — protocol, import boundary, manifest.
  # ─────────────────────────────────────────────────────────────────────────
  production-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f392efede  # v5.0.0
      with:
        python-version: '3.10'

    - name: Install production dependencies
      run: |
        pip install .

    - name: Run production CLI tests
      run: |
        python3 -m pytest tests/test_production/ -v