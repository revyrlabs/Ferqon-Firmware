name: Native Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - native_ringbuf
          - native_multicore
          - native_singlecore

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        pip install platformio

    - name: Install dependencies
      run: |
        pip install -r tools/requirements.txt

    - name: Generate platform headers
      run: |
        python tools/gen_platform_caps.py --all

    - name: Run ${{ matrix.env }} tests
      run: |
        pio test -e ${{ matrix.env }}
