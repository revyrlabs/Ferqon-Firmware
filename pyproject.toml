#
# Production package definition for the ferqonfw CLI.
#
# This file defines the installable production CLI package. It does NOT
# include development dependencies (pytest, ruff, black, yamllint) —
# those are in tools/requirements-dev.txt.
#
# Install production CLI:
#   pip install .
#
# Install development CLI (includes ferqonfw-dev):
#   pip install -e .[dev]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferqonfw"
version = "1.1.0"
description = "Ferqon Firmware CLI - Build, flash, and manage Ferqon firmware (production)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Revyr Labs" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Production-only runtime dependencies.
# No pytest, ruff, black, yamllint, or other dev-only tools.
dependencies = [
    "pyserial>=3.5",
    "platformio>=6.1.0,<7.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Development extras — installs ferqonfw-dev and test/lint tools.
dev = [
    "jsonschema>=4.17.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "yamllint>=1.32.0",
]

[project.scripts]
# Production CLI — installed by `pip install .`
ferqonfw = "ferqonfw.main:main"
# Development CLI — installed by `pip install -e .[dev]`.
# ferqonfw-dev lazily imports its command handlers, so the entry point
# itself is safe to register in a production-only install, but invoking
# any dev command without the [dev] extras installed will raise
# ImportError with a clear message.
ferqonfw-dev = "ferqonfw.dev_main:main"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
ferqonfw = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
per-file-ignores = { "tools/ferqonfw/main.py" = ["E402"], "tools/ferqonfw/dev_main.py" = ["E402"], "tests/hil/ferqon_selftest.py" = ["E402"], "tests/test_production/*.py" = ["E402"] }

[tool.black]
line-length = 88
