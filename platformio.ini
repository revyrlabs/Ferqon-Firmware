[platformio]
src_dir = src
include_dir = src
default_envs = pico
test_dir = tests

; Raspberry Pi Pico with Arduino framework
[env:pico]
platform = raspberrypi
framework = arduino
board = pico
upload_protocol = mbed
upload_port = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"1.0.0"'
    -DFERQON_BOARD_PICO
lib_deps =
    Wire
    SPI

; ESP32 with Arduino framework
[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"1.0.0"'
    -DFERQON_BOARD_ESP32
lib_deps =
    Wire
    SPI

; ESP32-S3 with Arduino framework
[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"1.0.0"'
