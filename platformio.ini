#
# Production PlatformIO configuration for Ferqon firmware.
#
# Source selection is sealed: only the files listed in [common]::_src_filter
# are compiled. No directory-wide or implicit inclusion. Each environment
# consumes only its own platforms/<board>/generated/ include path plus the
# root generated/ directory for build_timestamp.h and production_config.h.
#
# Platform packages are pinned to exact, established versions for
# deterministic, reproducible production builds.
[platformio]
src_dir = src
include_dir = src
default_envs = pico_arduino
test_dir = tests

; Protocol version — must match firmware/protocol/ssot/commands.json "version".
; Update here whenever gen_protocol.py is re-run against a new SSOT version.
; Firmware version is independent of protocol version and tracks the
; firmware release (bug fixes, new drivers, etc.) per semantic versioning.
[common]
protocol_version = 1.1.0
firmware_version = 1.1.0

; Sealed production source allowlist — every compiled src/*.cpp file.
; Paths are relative to src_dir (src/). To add a new source file, add it
; here AND to tools/production_manifest.json.
_src_filter =
    +<adc.cpp>
    +<app_state.cpp>
    +<capabilities.cpp>
    +<debug.cpp>
    +<device_info.cpp>
    +<dispatcher.cpp>
    +<driver_call.cpp>
    +<echo.cpp>
    +<ferqon_log.cpp>
    +<gpio.cpp>
    +<main.cpp>
    +<ping.cpp>
    +<protocol.cpp>
    +<pulse.cpp>
    +<reset.cpp>
    +<uart.cpp>

; Shared build flags for all hardware environments.
; Board-specific flags (FERQON_BOARD_*) are added per-env below.
; FERQON_SERIAL_BAUD and heartbeat/log defaults come from the generated
; production_config.h (emitted by pio_pre_build.py from production_config.json).
; FERQON_HAS_SERIAL1 enables the UART driver to use a secondary hardware UART
; (Serial1) instead of the control Serial, preventing protocol corruption.
; All supported boards must have at least 2 hardware UARTs.
_hw_build_flags =
    -DFERQON_FW_VERSION='"${common.firmware_version}"'
    -DFERQON_HAS_SERIAL1

; ─────────────────────────────────────────────────────────────────────────────
; Production hardware environments
; ─────────────────────────────────────────────────────────────────────────────

; Raspberry Pi Pico with Arduino framework
; env name must match pio_env in platforms/pico/board.yml
[env:pico_arduino]
platform = raspberrypi@1.19.0
framework = arduino
board = pico
upload_protocol = mbed
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_PICO
    -I${PROJECT_DIR}/platforms/pico/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; ESP32 with Arduino framework
[env:esp32]
platform = espressif32@7.0.1
framework = arduino
board = esp32dev
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_ESP32
    -I${PROJECT_DIR}/platforms/esp32/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; ESP32-S3 with Arduino framework
[env:esp32s3]
platform = espressif32@7.0.1
framework = arduino
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_ESP32S3
    -I${PROJECT_DIR}/platforms/esp32s3/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; Teensy 4.0 with Arduino framework
