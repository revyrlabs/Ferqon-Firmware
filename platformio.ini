; ─────────────────────────────────────────────────────────────────────────────
; In-development community boards.
; These have board.yml + generated headers but are NOT in the production bundle.
; All boards here have at least 2 hardware UARTs (Serial + Serial1).
; Build with: make build BOARD=<env>  or  pio run -e <env>
; ─────────────────────────────────────────────────────────────────────────────

; Arduino Mega 2560 (ATmega2560) — has Serial1/2/3
[env:mega2560]
platform = atmelavr@4.2.0
framework = arduino
board = megaatmega2560
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_MEGA2560
    -I${PROJECT_DIR}/platforms/in_development/mega2560/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; ESP8266 (NodeMCU / Wemos D1 Mini) — has Serial1
[env:esp8266]
platform = espressif8266@4.2.0
framework = arduino
board = nodemcuv2
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_ESP8266
    -I${PROJECT_DIR}/platforms/in_development/esp8266/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; STM32 Blue Pill (STM32F103C8) — has Serial1/2
[env:stm32bluepill]
platform = ststm32@9.0.0
framework = arduino
board = bluepill_f103c8_128k
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    ${common._hw_build_flags}
    -DFERQON_BOARD_STM32BLUEPILL
    -I${PROJECT_DIR}/platforms/in_development/stm32bluepill/generated
    -I${PROJECT_DIR}/generated
build_src_filter = ${common._src_filter}
extra_scripts = pre:tools/pio_pre_build.py

; ─────────────────────────────────────────────────────────────────────────────
; Development-only environment: native (host) for Unity-based unit tests.
; NOT a production target. Excluded from the production build bundle.
; ─────────────────────────────────────────────────────────────────────────────
[env:native]
platform = native@1.2.1
build_flags =
    -DFERQON_FW_VERSION='"${common.firmware_version}"'
    -DFERQON_BOARD_NATIVE
    -DUNITY_INCLUDE_CONFIG_H
    -I${PROJECT_DIR}/platforms/pico/generated
    -I${PROJECT_DIR}/generated
lib_deps =
    throwtheswitch/Unity @ 2.5.2
extra_scripts = pre:tools/pio_pre_build.py
test_build_src = false
