[platformio]
src_dir = src
include_dir = src
default_envs = pico
test_dir = tests

; Protocol version — must match firmware/protocol/ssot/commands.json "version".
; Update here whenever gen_protocol.py is re-run against a new SSOT version.
[common]
protocol_version = 1.1.0

; Raspberry Pi Pico with Arduino framework
[env:pico]
platform = raspberrypi
framework = arduino
board = pico
upload_protocol = mbed
upload_port = /media/alx/RPI-RP2/
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_PICO
lib_deps =
    Wire
    SPI

; ESP32 with Arduino framework
[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_ESP32
lib_deps =
    Wire
    SPI

; ESP32-S3 with Arduino framework
[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_ESP32S3
lib_deps =
    Wire
    SPI

; Teensy 4.0 with Arduino framework
[env:teensy40]
platform = teensy
framework = arduino
board = teensy40
upload_protocol = teensy-gui
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_TEENSY40
lib_deps =
    Wire
    SPI

; Teensy 4.1 with Arduino framework
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
upload_protocol = teensy-gui
monitor_speed = 115200
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_TEENSY41
lib_deps =
    Wire
    SPI

; Native (host) environment for Unity-based unit tests — no hardware required.
; Run with: pio test -e native
[env:native]
platform = native
build_flags =
    -DFERQON_FW_VERSION='"${common.protocol_version}"'
    -DFERQON_BOARD_NATIVE
    -DUNITY_INCLUDE_CONFIG_H
lib_deps =
    throwtheswitch/Unity @ ^2.5.2
extra_scripts = pre:tools/pio_pre_build.py
